name: Build and deploy sound library

on:
  workflow_dispatch:
    inputs:
      patch_tag:
        description: Immutable orchestra patch release tag
        required: true
        type: string
        default: 2026.11.09-orchestra-fix
      publish:
        description: Deploy the verified audio site (otherwise retain the candidate only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: audio-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'BreezyMomo/MomoSoundForge-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check out the pinned protocol implementation
        uses: actions/checkout@v6
        with:
          repository: BreezyMomo/MomoSoundForge
          ref: e0a843227894e430e6a67a03801404d5fad16225
          path: protocol-app

      - name: Install the protocol validator and test its rejection paths
        env:
          PROTOCOL_APP_ROOT: ${{ github.workspace }}/protocol-app
        run: |
          npm ci --prefix protocol-app
          node --test tools/build-library.test.mjs tools/validate-library.test.mjs

      - name: Download immutable orchestra patch
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_TAG: ${{ inputs.patch_tag }}
        run: gh release download "$PATCH_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --output patch.zip

      - name: Extract and build the complete catalog
        run: |
          rm -rf .patch _audio-site
          mkdir .patch
          unzip -q patch.zip -d .patch
          node tools/build-library.mjs --patch-dir .patch --output _audio-site --concurrency 12

      - name: Validate every graph, complete audio dependency and note boundary
        run: node tools/validate-library.mjs --app-root protocol-app --site _audio-site --report validation-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: library-validation
          path: validation-report.json

      - name: Check generated library size and catalog
        run: |
          test -f _audio-site/index.json
          test "$(find _audio-site -type f | wc -l)" -gt 1000
          test "$(du -sb _audio-site | cut -f1)" -lt 1073741824

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _audio-site
          retention-days: 1

  deploy:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified audio files
        id: deployment
        uses: actions/deploy-pages@v4
